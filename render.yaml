services:
  - type: web
    name: durvin-store-preview
    runtime: node
    plan: free
    buildCommand: npm ci && npm run db:generate && npm run build
    preDeployCommand: npx prisma migrate deploy && npm run db:seed
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: CUSTOMER_SESSION_SECRET
        generateValue: true
